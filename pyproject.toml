[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grantscout"
version = "1.0.0"
description = "AI-powered autonomous grant discovery agent for small nonprofits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "GrantScout Team"}
]

dependencies = [
    # Strands Agents SDK
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    
    # AWS
    "boto3>=1.35.0",
    
    # API Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.12",
    
    # Utilities
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "uuid6>=2024.7.10",
    "PyJWT>=2.8.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
