<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Circular Base with Emerald Glow -->
  <circle cx="32" cy="32" r="30" fill="#0B1D15" stroke="#10B981" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#10B981" stroke-width="1.5"/>
  
  <!-- Globe Meridians & Parallels (Green Globe) -->
  <ellipse cx="32" cy="32" rx="13" ry="28" fill="none" stroke="#34D399" stroke-width="1.5"/>
  <ellipse cx="32" cy="32" rx="28" ry="10" fill="none" stroke="#34D399" stroke-width="1.5"/>
  
  <!-- Crosshairs / Radar Axis -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#10B981" stroke-width="1.5" opacity="0.7"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#10B981" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Center Beacon -->
  <circle cx="32" cy="32" r="4.5" fill="#34D399" stroke="#ECFDF5" stroke-width="1.2"/>
  
  <!-- Glowing Radar Scan Sector -->
  <path d="M32 32 L58 18 A 30 30 0 0 0 32 2 Z" fill="url(#radar-sweep)" opacity="0.5"/>
  
  <defs>
    <linearGradient id="radar-sweep" x1="32" y1="32" x2="58" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
</svg>
