services:
  - type: web
    name: grantscout-api
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: AUTH_ENABLED
        value: "true"
      - key: SECRET_KEY
        sync: false
      - key: MASTER_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://grantscout.onrender.com,https://grantscout-api.onrender.com"
      - key: AWS_REGION
        value: us-east-1
      - key: AGENTCORE_RUNTIME_ARN
        value: arn:aws:bedrock-agentcore:us-east-1:630877783523:runtime/grantscout_grantscout_decoupled_agent-G78xoNByJ7
      - key: AGENTCORE_AGENT_ID
        value: grantscout_grantscout_decoupled_agent-G78xoNByJ7
      - key: USE_LOCAL_STORAGE
        value: "true"
      - key: LOCAL_STORAGE_PATH
        value: ./data
